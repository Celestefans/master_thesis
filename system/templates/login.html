{% extends 'base.html' %}

{% block title %}用户登录 - 一体化引导式图像超分系统{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="font-weight-light my-1"><i class="bi bi-person-circle me-2"></i>用户登录</h3>
                </div>
                <div class="card-body p-5">
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="name@example.com" required>
                            <label for="username">用户名 / Email</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <label for="password">密码</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" value="" id="rememberPasswordCheck">
                            <label class="form-check-label" for="rememberPasswordCheck">
                                记住我
                            </label>
                        </div>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-primary btn-lg" type="submit">登 录</button>
                        </div>
                        <div class="text-center mt-3">
                            <small class="text-muted">（演示系统：无需注册，任意输入即可登录）</small>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <div class="small"><a href="#">忘记密码?</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
